name: Merge automation

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled

permissions: {}

jobs:
  label-bridge:
    uses: cloudquery/.github/.github/workflows/merge-label-bridge.yml@main
    secrets:
      app-id: ${{ secrets.CQ_APP_ID }}
      app-private-key: ${{ secrets.CQ_APP_PRIVATE_KEY }}

  approve-bot-prs:
    uses: cloudquery/.github/.github/workflows/approve-bot-prs.yml@main
    secrets:
      approver-app-id: ${{ secrets.APPROVER_APP_ID }}
      approver-app-private-key: ${{ secrets.APPROVER_APP_PRIVATE_KEY }}

  priority-merge:
    uses: cloudquery/.github/.github/workflows/priority-merge.yml@main
    secrets:
      app-id: ${{ secrets.CQ_APP_ID }}
      app-private-key: ${{ secrets.CQ_APP_PRIVATE_KEY }}
