name: Approve bot pull requests

on:
  workflow_call:
    inputs:
      bot-logins:
        description: Comma-separated logins whose pull requests are approved, e.g. cloudquery-ci[bot]
        type: string
        default: cloudquery-ci[bot]
    secrets:
      approver-app-id:
        required: true
      approver-app-private-key:
        required: true

permissions: {}

concurrency:
  group: approve-bot-prs-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve:
    if: >-
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened", "reopened", "synchronize", "ready_for_review"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check author and sender
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BOT_LOGINS: ${{ inputs.bot-logins }}
        with:
          script: |
            const bots = process.env.BOT_LOGINS.split(',').map((login) => login.trim()).filter(Boolean);
            const author = context.payload.pull_request.user.login;
            const sender = context.payload.sender.login;
            const approve = bots.includes(author) && bots.includes(sender);
            if (!approve) {
              core.info(`Skipping: author '${author}' or sender '${sender}' is not an allowed bot`);
            }
            core.setOutput('approve', approve);

      - name: Generate GitHub App token
        if: steps.check.outputs.approve == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.approver-app-id }}
          private-key: ${{ secrets.approver-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: Approve
        if: steps.check.outputs.approve == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          APPROVER: ${{ steps.app-token.outputs.app-slug }}[bot]
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const { number, head } = context.payload.pull_request;
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number });
            const alreadyApproved = reviews.some(
              (review) => review.user?.login === process.env.APPROVER && review.state === 'APPROVED' && review.commit_id === head.sha,
            );
            if (alreadyApproved) {
              core.info(`Already approved at ${head.sha}`);
              return;
            }
            await github.rest.pulls.createReview({ owner, repo, pull_number: number, commit_id: head.sha, event: 'APPROVE' });
            core.info(`Approved at ${head.sha}`);
