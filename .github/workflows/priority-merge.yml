name: Priority merge

on:
  workflow_call:
    inputs:
      priority-label:
        type: string
        default: priority merge
    secrets:
      app-id:
        required: true
      app-private-key:
        required: true

permissions: {}

concurrency:
  group: priority-merge-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  jump-queue:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.action == 'labeled' &&
      github.event.label.name == inputs.priority-label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Move to the front of the merge queue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const id = context.payload.pull_request.node_id;
            const { node } = await github.graphql(
              `query($id: ID!) { node(id: $id) { ... on PullRequest { isInMergeQueue } } }`,
              { id },
            );
            if (node.isInMergeQueue) {
              await github.graphql(
                `mutation($id: ID!) { dequeuePullRequest(input: { id: $id }) { clientMutationId } }`,
                { id },
              );
            }
            try {
              const { enqueuePullRequest } = await github.graphql(
                `mutation($id: ID!) { enqueuePullRequest(input: { pullRequestId: $id, jump: true }) { mergeQueueEntry { position } } }`,
                { id },
              );
              core.info(`Queue position: ${enqueuePullRequest.mergeQueueEntry.position}`);
            } catch (error) {
              core.setFailed(
                `Could not add the pull request to the front of the merge queue: ${error.message}. Add the label again when required checks and reviews pass.`,
              );
            }
