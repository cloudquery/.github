name: Merge label bridge

on:
  workflow_call:
    inputs:
      automerge-label:
        type: string
        default: automerge
      blocking-labels:
        description: Comma-separated labels that block automatic merging
        type: string
        default: wip,no automerge
      merge-method:
        type: string
        default: squash
    secrets:
      app-id:
        required: true
      app-private-key:
        required: true

permissions: {}

concurrency:
  group: merge-label-bridge-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync-auto-merge:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable or disable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          AUTOMERGE_LABEL: ${{ inputs.automerge-label }}
          BLOCKING_LABELS: ${{ inputs.blocking-labels }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          PR_STATE_QUERY: |
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  id
                  state
                  isDraft
                  isInMergeQueue
                  autoMergeRequest { enabledAt }
                  labels(first: 100) { nodes { name } }
                }
              }
            }
          DEQUEUE_MUTATION: |
            mutation($id: ID!) { dequeuePullRequest(input: { id: $id }) { clientMutationId } }
        run: |
          set -euo pipefail

          state=$(gh api graphql \
            -F owner="$OWNER" -F repo="$REPO" -F number="$PR" \
            -f query="$PR_STATE_QUERY" --jq '.data.repository.pullRequest')

          pr_id=$(jq -r '.id' <<<"$state")
          is_open=$(jq -r '.state == "OPEN"' <<<"$state")
          is_draft=$(jq -r '.isDraft' <<<"$state")
          in_queue=$(jq -r '.isInMergeQueue' <<<"$state")
          auto_merge_on=$(jq -r '.autoMergeRequest != null' <<<"$state")
          has_automerge=$(jq -r --arg l "$AUTOMERGE_LABEL" '[.labels.nodes[].name] | index($l) != null' <<<"$state")
          has_blocking=$(jq -r --arg b "$BLOCKING_LABELS" \
            '($b | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $blocking
             | [.labels.nodes[].name] | any(. as $n | $blocking | index($n) != null)' <<<"$state")

          automerge_removed=false
          if [[ "$ACTION" == "unlabeled" && "$EVENT_LABEL" == "$AUTOMERGE_LABEL" ]]; then
            automerge_removed=true
          fi

          stop() {
            if [[ "$auto_merge_on" == "true" ]]; then
              echo "Disabling auto-merge: $1"
              gh pr merge "$PR" --repo "$OWNER/$REPO" --disable-auto
            fi
            if [[ "$in_queue" == "true" ]]; then
              echo "Removing from merge queue: $1"
              gh api graphql -F id="$pr_id" -f query="$DEQUEUE_MUTATION" >/dev/null
            fi
          }

          if [[ "$is_open" != "true" ]]; then
            echo "Pull request is not open"
          elif [[ "$has_blocking" == "true" ]]; then
            stop "blocking label present"
          elif [[ "$is_draft" == "true" ]]; then
            stop "pull request is a draft"
          elif [[ "$automerge_removed" == "true" ]]; then
            stop "'$AUTOMERGE_LABEL' label removed"
          elif [[ "$has_automerge" != "true" ]]; then
            echo "No '$AUTOMERGE_LABEL' label"
          elif [[ "$auto_merge_on" == "true" || "$in_queue" == "true" ]]; then
            echo "Auto-merge already enabled"
          else
            echo "Enabling auto-merge ($MERGE_METHOD)"
            gh pr merge "$PR" --repo "$OWNER/$REPO" --auto "--$MERGE_METHOD"
          fi
