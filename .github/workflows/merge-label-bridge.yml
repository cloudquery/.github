name: Merge label bridge

on:
  workflow_call:
    inputs:
      automerge-label:
        type: string
        default: automerge
      blocking-labels:
        description: Comma-separated labels that block automatic merging
        type: string
        default: wip,no automerge
      merge-method:
        description: MERGE, SQUASH or REBASE
        type: string
        default: SQUASH
    secrets:
      app-id:
        required: true
      app-private-key:
        required: true

permissions: {}

concurrency:
  group: merge-label-bridge-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync-auto-merge:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable or disable auto-merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          AUTOMERGE_LABEL: ${{ inputs.automerge-label }}
          BLOCKING_LABELS: ${{ inputs.blocking-labels }}
          MERGE_METHOD: ${{ inputs.merge-method }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const { action, label, pull_request: event } = context.payload;
            const automergeLabel = process.env.AUTOMERGE_LABEL;
            const blockingLabels = process.env.BLOCKING_LABELS.split(',').map((name) => name.trim()).filter(Boolean);
            const mergeMethod = process.env.MERGE_METHOD.toUpperCase();

            const { repository: { pullRequest: pr } } = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    id
                    state
                    isDraft
                    isInMergeQueue
                    autoMergeRequest { enabledAt }
                    labels(first: 100) { nodes { name } }
                  }
                }
              }`,
              { owner, repo, number: event.number },
            );

            const labels = pr.labels.nodes.map(({ name }) => name);
            const autoMergeEnabled = pr.autoMergeRequest !== null;

            const stop = async (reason) => {
              if (autoMergeEnabled) {
                core.info(`Disabling auto-merge: ${reason}`);
                await github.graphql(
                  `mutation($id: ID!) { disablePullRequestAutoMerge(input: { pullRequestId: $id }) { clientMutationId } }`,
                  { id: pr.id },
                );
              }
              if (pr.isInMergeQueue) {
                core.info(`Removing from merge queue: ${reason}`);
                await github.graphql(
                  `mutation($id: ID!) { dequeuePullRequest(input: { id: $id }) { clientMutationId } }`,
                  { id: pr.id },
                );
              }
            };

            const mergeNow = async () => {
              try {
                await github.graphql(
                  `mutation($id: ID!) { enqueuePullRequest(input: { pullRequestId: $id }) { clientMutationId } }`,
                  { id: pr.id },
                );
                core.info('Added to merge queue');
              } catch (error) {
                core.info(`Merge queue not available (${error.message}), merging directly`);
                await github.rest.pulls.merge({ owner, repo, pull_number: event.number, merge_method: mergeMethod.toLowerCase() });
              }
            };

            const enable = async () => {
              try {
                await github.graphql(
                  `mutation($id: ID!, $method: PullRequestMergeMethod!) {
                    enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: $method }) { clientMutationId }
                  }`,
                  { id: pr.id, method: mergeMethod },
                );
                core.info(`Enabled auto-merge (${mergeMethod})`);
              } catch (error) {
                if (!/clean status/i.test(error.message)) throw error;
                core.info('Pull request is ready to merge');
                await mergeNow();
              }
            };

            if (pr.state !== 'OPEN') {
              core.info('Pull request is not open');
            } else if (labels.some((name) => blockingLabels.includes(name))) {
              await stop('blocking label present');
            } else if (pr.isDraft) {
              await stop('pull request is a draft');
            } else if (action === 'unlabeled' && label?.name === automergeLabel) {
              await stop(`'${automergeLabel}' label removed`);
            } else if (!labels.includes(automergeLabel)) {
              core.info(`No '${automergeLabel}' label`);
            } else if (autoMergeEnabled || pr.isInMergeQueue) {
              core.info('Auto-merge already enabled');
            } else {
              await enable();
            }
